<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netflix Clone - Browse</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">
  <header class="bg-gray-800 p-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Netflix Clone</h1>
    <nav>
      <a href="browse.html" class="px-3 text-red-600 font-bold">Browse</a>
      <a href="profile.html" class="px-3 hover:text-red-600 transition">Profile</a>
      <a href="login.html" class="px-3 hover:text-red-600 transition">Logout</a>
    </nav>
  </header>
  <main class="flex-grow p-6">
    <div class="mb-6 flex justify-between items-center">
      <h2 class="text-3xl font-semibold">Browse Movies</h2>
      <input type="text" id="searchInput" placeholder="Search movies..." class="p-2 rounded bg-gray-700 text-white focus:outline-none focus:ring-2 focus:ring-red-600" />
    </div>
    <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
      <!-- Movie cards will be inserted here -->
    </div>
  </main>
  <footer class="bg-gray-800 p-4 text-center text-sm text-gray-400">
    &copy; 2024 Netflix Clone. All rights reserved.
  </footer>
  <script>
    const moviesGrid = document.getElementById('moviesGrid');
    const searchInput = document.getElementById('searchInput');
    let movies = [];

    async function fetchMovies() {
      try {
        const res = await fetch('http://localhost:3001/api/movies');
        movies = await res.json();
        displayMovies(movies);
      } catch (error) {
        moviesGrid.innerHTML = '<p class="text-red-600">Failed to load movies.</p>';
      }
    }

    function displayMovies(moviesToDisplay) {
      moviesGrid.innerHTML = '';
      if (moviesToDisplay.length === 0) {
        moviesGrid.innerHTML = '<p>No movies found.</p>';
        return;
      }
      moviesToDisplay.forEach(movie => {
        const movieCard = document.createElement('div');
        movieCard.className = 'bg-gray-800 rounded overflow-hidden shadow-lg cursor-pointer hover:shadow-red-600 transition';
        movieCard.innerHTML = `
          <video class="w-full h-40 object-cover" src="${movie.videoUrl}" muted preload="metadata"></video>
          <div class="p-2">
            <h3 class="font-bold text-lg">${movie.title}</h3>
            <p class="text-sm text-gray-400">${movie.year} - ${movie.genre}</p>
          </div>
        `;
        movieCard.addEventListener('click', () => {
          window.location.href = 'detail.html?id=' + movie.id;
        });
        moviesGrid.appendChild(movieCard);
      });
    }

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      const filtered = movies.filter(m => m.title.toLowerCase().includes(query));
      displayMovies(filtered);
    });

    fetchMovies();
  </script>
</body>
</html>
