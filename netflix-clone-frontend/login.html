<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netflix Clone - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center">
  <div class="bg-gray-800 p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-3xl font-bold mb-6 text-center">Login</h2>
    <form id="loginForm" class="space-y-6">
      <div>
        <label for="username" class="block mb-2">Username</label>
        <input type="text" id="username" name="username" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-red-600" />
      </div>
      <div>
        <label for="password" class="block mb-2">Password</label>
        <input type="password" id="password" name="password" required class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-red-600" />
      </div>
      <button type="submit" class="w-full bg-red-600 hover:bg-red-700 py-3 rounded font-bold transition">Login</button>
    </form>
    <p class="mt-6 text-center">
      Don't have an account?
      <a href="signup.html" class="text-red-600 hover:underline">Sign Up</a>
    </p>
  </div>
  <script>
    const loginForm = document.getElementById('loginForm');
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = loginForm.username.value;
      const password = loginForm.password.value;
      try {
        const res = await fetch('http://localhost:3001/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (data.success) {
          alert('Login successful! Welcome ' + data.username);
          // Redirect to browse page or user profile
          window.location.href = 'browse.html';
        } else {
          alert('Login failed: ' + data.message);
        }
      } catch (error) {
        alert('Error connecting to server');
      }
    });
  </script>
</body>
</html>
