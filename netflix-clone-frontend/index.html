<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netflix Clone - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }

<body class="bg-gray-900 text-white min-h-screen flex flex-col">
  <header class="bg-gray-800 p-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Netflix Clone</h1>
    <nav>
      <a href="browse.html" class="px-3 hover:text-red-600 transition">Browse</a>

      <a href="signup.html" class="px-3 hover:text-red-600 transition">Sign Up</a>

    <h2 class="text-3xl font-semibold mb-4">Welcome to Netflix Clone</h2>
    <p class="mb-6">Browse and watch your favorite movies and TV shows.</p>
    <a href="browse.html" class="inline-block bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded transition">Start Browsing</a>

  <footer class="bg-gray-800 p-4 text-center text-sm text-gray-400">
