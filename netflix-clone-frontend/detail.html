<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Netflix Clone - Movie Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col">
  <header class="bg-gray-800 p-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold cursor-pointer" onclick="window.location.href='browse.html'">Netflix Clone</h1>
    <nav>
      <a href="browse.html" class="px-3 hover:text-red-600 transition">Browse</a>
      <a href="profile.html" class="px-3 hover:text-red-600 transition">Profile</a>
      <a href="login.html" class="px-3 hover:text-red-600 transition">Logout</a>
    </nav>
  </header>
  <main class="flex-grow p-6 max-w-5xl mx-auto">
    <div id="movieDetail" class="space-y-6">
      <!-- Movie details will be loaded here -->
    </div>
  </main>
  <footer class="bg-gray-800 p-4 text-center text-sm text-gray-400">
    &copy; 2024 Netflix Clone. All rights reserved.
  </footer>
  <script>
    const movieDetail = document.getElementById('movieDetail');

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    async function fetchMovie(id) {
      try {
        const res = await fetch('http://localhost:3001/api/movies/' + id);
        if (!res.ok) throw new Error('Movie not found');
        const movie = await res.json();
        displayMovie(movie);
      } catch (error) {
        movieDetail.innerHTML = '<p class="text-red-600">Failed to load movie details.</p>';
      }
    }

    function displayMovie(movie) {
      movieDetail.innerHTML = `
        <h2 class="text-4xl font-bold">${movie.title} (${movie.year})</h2>
        <video controls class="w-full max-h-96 rounded shadow-lg" src="${movie.videoUrl}"></video>
        <p class="mt-4 text-lg">${movie.description}</p>
        <p class="mt-2 text-gray-400">Genre: ${movie.genre}</p>
      `;
    }

    const movieId = getQueryParam('id');
    if (movieId) {
      fetchMovie(movieId);
    } else {
      movieDetail.innerHTML = '<p class="text-red-600">No movie selected.</p>';
    }
  </script>
</body>
</html>
